name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Absolute URL used for sitemap.xml / robots.txt of the GitHub Pages build.
  SITE_URL: https://s-kaisei.github.io/it-knowledge-base/

jobs:
  verify:
    name: Quality gate (npm run verify)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      # Browser version always matches the @playwright/test version in package-lock.json.
      - run: npx playwright install --with-deps chromium
      # Same script as Docker (qa) and the Claude Code Stop hook.
      - run: npm run verify
      - name: Upload Playwright report and screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
      # The verified GitHub Pages build (BASE_PATH=/it-knowledge-base/) is the exact artifact deploy.yml publishes.
      - name: Upload verified site artifact
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: build-subpath/client/
          include-hidden-files: true # keeps .nojekyll
          retention-days: 7
          if-no-files-found: error

  docker:
    name: Docker images build and smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build dev image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: dev
          push: false
      - name: Build production image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: production
          push: false
          load: true
          tags: it-knowledge-base:ci
      - name: Smoke test the nginx container
        run: |
          docker run -d --name ikb -p 127.0.0.1:8080:8080 --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges:true it-knowledge-base:ci
          for _ in $(seq 1 20); do curl -fs http://127.0.0.1:8080/ >/dev/null && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/fundamentals/)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/no-such-page/)" = 404
          test "$(docker exec ikb id -u)" != 0
          ! docker exec ikb sh -c 'command -v node'
      - name: Container logs
        if: ${{ failure() }}
        run: docker logs ikb || true
