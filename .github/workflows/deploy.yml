name: Deploy to GitHub Pages

# Publishes the artifact that CI built AND verified on main (no rebuild here).
# Disabled until the repository variable PAGES_DEPLOY_ENABLED is set to "true"
# (Settings → Secrets and variables → Actions → Variables) after the owner approves publishing.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && vars.PAGES_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read # download the artifact from the CI run
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download verified site from the CI run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: site
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Check artifact
        run: |
          test -f site/index.html
          test -f site/404.html
          test -f site/.nojekyll
          test -d site/pagefind
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      # The artifact name includes the attempt number so "Re-run failed jobs" does not collide with
      # the artifact uploaded by the previous attempt (deploy-pages rejects duplicate names).
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
          name: github-pages-${{ github.run_attempt }}
      # The artifact listing API is eventually consistent: deploy-pages has failed with "Found 0 artifact(s)"
      # one second after a successful upload. Wait until the artifact is listed (max ~60 s).
      - name: Wait for the Pages artifact to be listed
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT: github-pages-${{ github.run_attempt }}
        run: |
          for _ in $(seq 1 30); do
            if gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" --jq '.artifacts[].name' | grep -qx "$ARTIFACT"; then
              echo "artifact $ARTIFACT is listed"; exit 0
            fi
            sleep 2
          done
          echo "artifact $ARTIFACT was not listed within 60 s" >&2; exit 1
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
