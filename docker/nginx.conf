# Static site server for the production image.
# __BASE_PATH__ is replaced at image build time (Dockerfile builder stage), e.g. "/" or "/it-knowledge-base/".
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    absolute_redirect off;
    server_tokens off;
    charset utf-8;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/xml application/xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    # Existing files and pre-rendered pages only. Unknown URLs get a real 404
    # (never an unconditional rewrite to the top page).
    location / {
        try_files $uri $uri/index.html $uri.html =404;
    }

    # Hashed build assets are immutable.
    location ~* /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    error_page 404 __BASE_PATH__404.html;
    location = __BASE_PATH__404.html {
        internal;
    }
}
